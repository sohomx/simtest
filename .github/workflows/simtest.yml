name: SimTest CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  simtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies (Poetry)
        run: |
          poetry --version
          poetry install --no-interaction --no-ansi

      - name: Init agent graph
        run: poetry run simtest init --write-graph

      - name: Fuzz (no quick gate)
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci-test/stable-failure')) }}
        run: poetry run simtest fuzz --no-quick --trace-log tmp/ci.jsonl

      - name: Fuzz (forced failure for stable-failure branches)
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci-test/stable-failure') }}
        env:
          SIMTEST_FORCE_BAD_OUTPUT: "1"
        run: poetry run simtest fuzz --no-quick --trace-log tmp/ci.jsonl

      - name: Detect failure signatures
        id: detect
        run: |
          if grep -q '"signature"' tmp/ci.jsonl; then
            echo "has_signatures=true" >> $GITHUB_OUTPUT
            echo "Found failure signatures in trace; will run audit."
          else
            echo "has_signatures=false" >> $GITHUB_OUTPUT
            echo "No failure signatures; skipping audit."
          fi

      - name: Audit determinism (2/2)
        if: ${{ steps.detect.outputs.has_signatures == 'true' && !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci-test/stable-failure')) }}
        run: poetry run simtest audit --trace tmp/ci.jsonl --runs 2

      - name: Audit determinism (2/2) [forced-failure]
        if: ${{ steps.detect.outputs.has_signatures == 'true' && github.event_name == 'pull_request' && startsWith(github.head_ref, 'ci-test/stable-failure') }}
        env:
          SIMTEST_FORCE_BAD_OUTPUT: "1"
        run: poetry run simtest audit --trace tmp/ci.jsonl --runs 2

      - name: Upload trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simtest-trace
          path: tmp/ci.jsonl
          if-no-files-found: warn
