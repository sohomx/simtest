name: SimTest CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  simtest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: poetry install

    - name: Run SimTest CI check
      run: bash scripts/simtest_ci_check.sh
