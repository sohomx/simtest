[tool.poetry]
name = "simtest"
version = "0.1.0"
description = "CLI-first fuzz & coverage gate for LLM agent graphs"
authors = ["Sohom <your@email.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "simtest" }
]

[tool.poetry.dependencies]
python = "^3.10"
typer = {extras = ["all"], version = "^0.9.0"}
click = "<8.1.7"  # pinned to avoid typer incompat
rich = "^13.7.1"
pydantic = "^2.7"
pyyaml = "^6.0"
networkx = "^3.3"
openai = "^1.93.0"
tiktoken = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.5"
mypy = "^1.10"
types-pyyaml = "^6.0"
mkdocs = "^1.6.1"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.poetry.scripts]
simtest = "simtest.__main__:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


