
---

#### 📄 `examples/basic_agent/.github/workflows/simtest.yml`

```yaml
name: SimTest CI

on:
  push:
  pull_request:

jobs:
  simtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install .
      - run: simtest init --path examples/basic_agent/main.py --write-graph
      - run: simtest seed --suite tool-schema-sanity
      - run: simtest fuzz --quick --report simtest-report.md
